name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      # Zero-dependency build: no npm install needed.
      - name: Build site
        run: node scripts/build.mjs
        env:
          MODE: ${{ vars.MODE || 'preview' }}            # set repo variable MODE=production at launch
          STRICT: ${{ vars.STRICT }}                     # STRICT=1 fails the build if placeholders remain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          # Public by design (they ship in every visitor's browser); RLS in supabase/schema.sql protects the data.
          # Repository variables of the same name override these defaults. Never put the secret key here.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://plqqwwdourdbbjqqpqms.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_eJq4PtuTBHM-pdxsOxEhuw_xx-FtJEr' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
